name: Build

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
    branches-ignore:
      - gh-pages

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref != 'gh-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Evergreen.csproj

      - name: Build
        run: dotnet build Evergreen.csproj --no-restore --configuration Release
