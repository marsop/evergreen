name: Build

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
    branches-ignore:
      - gh-pages

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref != 'gh-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Evergreen.csproj

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install client dependencies
        run: npm ci

      - name: Build
        run: dotnet build Evergreen.csproj --no-restore --configuration Release

      - name: Test garden and localization
        run: dotnet test Tests/Evergreen.Tests.csproj --configuration Release

      - name: Test localization bootstrap and PWA
        run: node --test Tests/localization.test.cjs Tests/pwa.test.cjs

      - name: Test client data and compression
        run: npm run test:client

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test Firestore rules
        run: npm run test:rules

      - name: Publish for browser tests
        run: dotnet publish Evergreen.csproj --configuration Release --output publish

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Test published PWA
        run: node --test Tests/pwa-browser.test.mjs

      - name: Test Firebase browser integration
        run: npm run test:browser
