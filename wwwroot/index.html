<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="garden.css" />
    <link rel="stylesheet" href="Evergreen.styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>Evergreen</title>
</head>

<body>
    <div id="app">
        <p data-localization="loading">Loading Evergreen...</p>
    </div>
    <div id="blazor-error-ui">
        <span data-localization="error">An unexpected error occurred.</span>
        <a href="" class="reload" data-localization="reload">Reload</a>
        <button type="button" class="dismiss" data-localization="dismiss" aria-label="Dismiss">🗙</button>
    </div>
    <script src="localization.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start({
            applicationCulture: document.documentElement.lang,
            // Load all translations so live switching never needs a page reload.
            configureRuntime: runtime => runtime.withConfig({ loadAllSatelliteResources: true })
        }).catch(error => {
            console.error("Evergreen: application startup failed.", error);
            document.querySelector("#blazor-error-ui").style.display = "block";
        });
    </script>
</body>

</html>
