<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="garden.css" />
    <link rel="stylesheet" href="seasonal-background.css" />
    <link rel="stylesheet" href="Evergreen.styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="seasonal-background.js"></script>
    <title>Evergreen</title>
    <meta name="description" content="Evergreen is a plant-care dashboard for tracking plants, watering schedules, growing places, and care journals." />

    <!-- Open Graph / WhatsApp / Facebook sharing metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Evergreen" />
    <meta property="og:title" content="Evergreen – Plant care, in rhythm" />
    <meta property="og:description" content="Keep your indoor garden thriving. Track watering schedules, growing places, and care journals with Evergreen." />
    <meta property="og:image" content="images/og-preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Evergreen – Plant care, in rhythm" />

    <!-- Twitter / X sharing metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Evergreen – Plant care, in rhythm" />
    <meta name="twitter:description" content="Keep your indoor garden thriving. Track watering schedules, growing places, and care journals with Evergreen." />
    <meta name="twitter:image" content="images/og-preview.jpg" />
</head>

<body>
    <div class="seasonal-background" aria-hidden="true" inert>
        <div class="seasonal-background__layer"></div>
        <div class="seasonal-background__layer"></div>
    </div>
    <div id="app">
        <p data-localization="loading">Loading Evergreen...</p>
    </div>
    <div id="blazor-error-ui">
        <span data-localization="error">An unexpected error occurred.</span>
        <a href="" class="reload" data-localization="reload">Reload</a>
        <button type="button" class="dismiss" data-localization="dismiss" aria-label="Dismiss">🗙</button>
    </div>
    <script src="localization.js"></script>
    <script src="garden-storage.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start({
            applicationCulture: document.documentElement.lang,
            // Load all translations so live switching never needs a page reload.
            configureRuntime: runtime => runtime.withConfig({ loadAllSatelliteResources: true })
        }).catch(error => {
            console.error("Evergreen: application startup failed.", error);
            document.querySelector("#blazor-error-ui").style.display = "block";
        });
    </script>
</body>

</html>
